services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_PATH: /app/data/goodshare.sqlite
      FILES_DIR: /app/data/files
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your .env file}
      FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
      # Optional: enables backup-email reminders for everyone using this
      # server. Leave SMTP_HOST unset to disable the feature entirely.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - goodshare-data:/app/data
    networks:
      - npm_proxy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WEBDAV_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - npm_proxy

volumes:
  goodshare-data:

networks:
  # The Docker network your Nginx Proxy Manager container is already on,
  # so NPM can reach these two containers by name without publishing any
  # ports to the host. Find the exact name with `docker network ls`
  # (often "npm_default" or "proxy") and replace it below.
  npm_proxy:
    external: true
    name: npm_proxy
