services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_PATH: /app/data/goodshare.sqlite
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - goodshare-data:/app/data
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WEBDAV_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  goodshare-data:
